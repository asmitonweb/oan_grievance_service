  /api/v1/administrative-areas:
    get:
      tags:
      - Administrative Areas
      summary: Fetch administrative areas
      description: "Public endpoint to fetch administrative areas for cascading dropdowns and searches.\n\
        \nQuery Modes:\n    1. Cascading Drill-Down:\n       - No parent provided: returns all top-level\
        \ Regions (level_name='Region').\n       - parent provided (e.g. 'region-ET14', ['region-ET14',\
        \ 'region-ET07'], or 'region-ET14,region-ET07'): returns immediate child nodes or tier descendants.\n\
        \    2. Level Filter:\n       - level_name provided (e.g. 'Region', 'Zone', 'Woreda', 'Kebele').\n\
        \    3. Free-Text Search:\n       - search provided: searches across area_name, code, or path_code.\n\
        \    4. Ancestor Breadcrumbs:\n       - ancestors_of provided (area ID or path_code): returns\
        \ the chain from Country down to the node.\n\nArgs:\n    parent (str | list[str], optional): Name,\
        \ path_code, or comma-separated list of parent area(s).\n    level_name (str, optional): Hierarchy\
        \ tier (Region, Zone, Woreda, Kebele).\n    search (str, optional): Search query matching area\
        \ name or code.\n    ancestors_of (str, optional): Area name or path_code to fetch ancestor hierarchy\
        \ for.\n    limit (int, optional): Max records returned (default 100, max 500).\n\nReturns:\n\
        \    List of administrative area dictionaries with ID, area_name, code, path_code, level_name,\
        \ is_group."
      operationId: get_api_v1_administrative_areas
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrativeAreasListResponse'
        '400':
          description: Validation or Bad Input Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized / Authentication Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden / Insufficient Role Scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      parameters:
      - name: parent
        in: query
        required: false
        schema:
          type: string
        description: Parent area ID, path_code, or comma-separated list of parents (cascading drill-down)
      - name: level_name
        in: query
        required: false
        schema:
          type: string
        description: Filter by administrative tier (e.g. Region, Zone, Woreda, Kebele)
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Free text search by area name or code
      - name: ancestors_of
        in: query
        required: false
        schema:
          type: string
        description: Return breadcrumb chain for specified node
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          maximum: 500
        description: Maximum records returned
      security: []
