  /api/v1/charts:
    get:
      tags:
      - Dashboard Charts
      summary: Dashboard charts (Grievance Admin)
      description: 'Several charts in one round trip, each built and cached on its own.


        A chart that fails comes back as `data[<id>] = null` with its error in

        `meta.errors`, so one broken tile does not blank the dashboard.'
      operationId: get_api_v1_charts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardChartsResponse'
        '400':
          description: Validation or Bad Input Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized / Authentication Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden / Insufficient Role Scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      parameters:
      - name: charts
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated chart ids (at most 20); all charts when omitted
      - name: region
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated Region P-codes (e.g. ET04)
      - name: service_category
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated service category names; `category` is accepted as an alias
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Period start (trend and category-resolution charts)
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Period end, default today
      - name: month
        in: query
        required: false
        schema:
          type: string
          pattern: ^\d{4}-\d{2}$
        description: YYYY-MM for grvPerformanceKpis, default the current month
      - name: granularity
        in: query
        required: false
        schema:
          type: string
          enum:
          - month
          - week
          default: month
        description: Period size for grvNetBacklogTrend
      - name: assigned_dept
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated department names
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        description: Rows for grvRecent
      security:
      - BearerAuth: []
