# OAN Grievance Service API -- OpenAPI 3.0.3 (PUBLIC)
# Contract with vendor extensions removed. Dynamically generated from generate_openapi_spec.py.
openapi: 3.0.3
info:
  title: OAN Grievance Service API
  version: 1.0.0
  description: Grievance management and citizen feedback service for OpenAgriNet (OAN). Provides RESTful
    endpoints for submitting complaints, tracking resolution progress, cascading administrative area drill-downs,
    citizen-officer timeline messaging, escalation management, change requests, and case resolution workflows.
  contact:
    name: COSS - Centre for Open Societal Systems
servers:
- url: http://localhost:8000
  description: Local Frappe Bench
- url: https://grievance.openagrinet.org
  description: Production Grievance Gateway
tags:
- name: Health & Monitoring
  description: Service health probes and uptime pings
- name: Submitter Management
  description: Intake reference options, submitter registration, and moderation
- name: Administrative Areas
  description: Cascading geographic drill-downs, breadcrumbs, and search
- name: Grievance Drafts
  description: Draft grievance persistence, resume, submit, and discard
- name: Grievances Core
  description: Case intake, tracking, and filtered list views
- name: Change Requests
  description: Request, review, and decide on grievance field changes (department, officer, SLA deferral,
    anonymity)
- name: Grievance Lifecycle & Actions
  description: Communication threads, notes, reopen, reject, escalate, and resolution confirmation
- name: Attachments
  description: Supporting document and evidence upload, listing, download, and deletion
- name: Dashboard Charts
paths:
