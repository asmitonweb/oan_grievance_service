              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      parameters:
      - name: area_id_or_path
        in: path
        required: true
        schema:
          type: string
        description: Area ID (e.g. 'kebele-ET140108101008') or path_code ('ET.ET14.01.08.101.008')
      security: []
  /api/v1/grievances:
    get:
      tags:
      - Grievances Core
      summary: List grievances with filtering, pagination, and sorting
      description: "Retrieve paginated and filtered list of grievances.\n\nEnforces deny-by-default RBAC\
        \ through permission query conditions:\n- Grievance Submitters only see their own cases and assisted\
        \ submissions.\n- Grievance Officers only see cases matching their RBAC scope (administrative\
        \ area subtree,\n  department, category) or directly assigned to them.\n- Grievance Admins and\
        \ System Managers see all cases.\n\nSupports multi-select values (list, JSON array, or comma-separated\
        \ string) for status,\nservice_category/category, administrative_area/location/region/zone/woreda/kebele,\n\
        grievance_type, department, and submission_channel.\n\nStatus filters use the queue cards (All,\
        \ In Progress, Require More Info, Rejected,\nResolved, Closed; officers also get Assigned). Draft\
        \ is never returned. Workflow\nstages that are not a card are reported as the card they roll up\
        \ into."
      operationId: get_api_v1_grievances
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrievanceListResponse'
        '400':
          description: Validation or Bad Input Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized / Authentication Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden / Insufficient Role Scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Page number
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        description: Page size
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated queue statuses: All, In Progress, Require More Info, Rejected, Resolved,
          Closed. Draft is excluded.'
      - name: category
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated service categories e.g. 'Inputs,Payments'
      - name: service_category
        in: query
        required: false
        schema:
          type: string
        description: Single category alias
      - name: grievance_type
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated grievance types
      - name: region
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated regional administrative area IDs
      - name: administrative_area
        in: query
        required: false
        schema:
          type: string
        description: Single administrative area ID or path_code
      - name: from_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Creation date lower bound (YYYY-MM-DD)
      - name: to_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Creation date upper bound (YYYY-MM-DD)
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Free text search matching ticket, citizen name, or phone
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          default: creation
        description: Column to order by
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
        description: Sort direction
      security:
      - BearerAuth: []
    post:
      tags:
      - Grievances Core
      summary: Submit a new grievance
      description: Submit a grievance in one request using the current draft flow.
      operationId: post_api_v1_grievances
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrievanceSubmitResultResponse'
        '400':
          description: Validation or Bad Input Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized / Authentication Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden / Insufficient Role Scope
          content:
