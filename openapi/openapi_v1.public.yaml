  /api/v1/submitters/options:
    get:
      tags:
      - Submitter Management
      summary: Dropdown options and reference data for submitters
      description: "Dropdown options and reference data needed for submitters, intake and public registration.\n\
        \nArgs:\n    search_country (str, optional): Search term to filter country phone extensions (matches\
        \ name, ISO code, or ISD).\n    country (str, optional): Exact country name or 2-letter ISO code\
        \ (e.g. 'ET', 'Ethiopia').\n    include_phone_extensions (bool, optional): Whether to include\
        \ country phone extensions (default True).\n    service_category (str, optional): Filter grievance\
        \ types by a specific service category (e.g. 'Inputs').\n\nReturns:\n    submitter_types: Active\
        \ submitter types (e.g. Individual Farmer, DA, Cooperative, NGO, etc.)\n    identity_schemes:\
        \ Supported identity schemes (Fayda, Registration Number, Phone)\n    submission_types: Active\
        \ intake channels (e.g. Mobile App, Web Portal, etc.)\n    preferred_languages: Supported notification\
        \ languages\n    phone_extensions: Country phone extensions / dialing prefixes (ISD codes)\n \
        \   service_categories: Active service categories (e.g. Inputs, Schemes, Payments, etc.)\n   \
        \ grievance_types: Active grievance types (optionally filtered by service_category)"
      operationId: get_api_v1_submitters_options
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitterOptionsResponse'
        '400':
          description: Validation or Bad Input Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized / Authentication Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden / Insufficient Role Scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      parameters:
      - name: search_country
        in: query
        required: false
        schema:
          type: string
        description: Filter phone ISD prefixes
      - name: country
        in: query
        required: false
        schema:
          type: string
        description: Exact country name or 2-letter ISO code
      - name: include_phone_extensions
        in: query
