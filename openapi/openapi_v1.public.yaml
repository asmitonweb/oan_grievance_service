components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide JWT access token as `Bearer <token>` in the Authorization header.
    DashboardKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: API key of the OAN dashboards (Kong consumer `oan-dashboards`, group `dashboards`).
        Checked and stripped by the gateway; the platform itself treats the chart routes as public, so
        before the gateway enforces keys the header is simply ignored.
  schemas:
    ApiMeta:
      type: object
      properties:
        api_version:
          type: string
          example: v1
          description: Semantic API version
        status:
          type: string
          example: current
          description: Lifecycle status
      required:
      - api_version
    StandardErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
          enum:
          - error
        message:
          type: string
          description: Human-readable error description
        exception:
          type: string
          nullable: true
          description: Exception class name
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                nullable: true
                description: Field causing the validation error
              message:
                type: string
                description: Error message for the specific field
          nullable: true
          description: Structured validation errors if applicable
        meta:
          $ref: '#/components/schemas/ApiMeta'
        request_id:
          type: string
          format: uuid
          nullable: true
          description: Tracing correlation ID
      required:
      - status
      - message
      description: Standard error envelope returned on 4xx/5xx responses
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
          description: Current page number
        page_size:
          type: integer
          example: 20
          description: Items per page
        total_count:
          type: integer
          example: 142
          description: Total matching records
        total_pages:
          type: integer
          example: 8
          description: Total pages available
      required:
      - page
      - page_size
      - total_count
      - total_pages
      description: Pagination metadata block
    HealthData:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: oan_grievance_service
        api_version:
          type: string
          example: v1
      required:
      - status
      - service
      - api_version
      description: Service health status payload
    PingData:
      type: object
      properties:
        ping:
          type: string
          example: pong
        service:
          type: string
          example: oan_grievance_service
        api_version:
          type: string
          example: v1
      required:
      - ping
      - service
      - api_version
      description: Service ping payload
    SubmitterTypeItem:
      type: object
      properties:
        type_name:
          type: string
          example: Individual Farmer
        code:
          type: string
          example: IND_FARMER
        description:
          type: string
          nullable: true
      required:
      - type_name
    SubmissionTypeItem:
      type: object
      properties:
        type_name:
          type: string
          example: Mobile App
        code:
          type: string
          example: MOB_APP
        description:
          type: string
          nullable: true
      required:
      - type_name
    OptionKeyValue:
      type: object
      properties:
        value:
          type: string
          example: Inputs
        label:
          type: string
          example: Agricultural Inputs
        code:
          type: string
          nullable: true
      required:
      - value
      - label
    PhoneExtensionItem:
      type: object
      properties:
        country:
          type: string
          example: Ethiopia
        code:
          type: string
          example: ET
        isd:
          type: string
          example: '+251'
      required:
      - country
      - code
      - isd
    SubmitterOptionsData:
      type: object
      properties:
        submitter_types:
          type: array
          items:
            $ref: '#/components/schemas/SubmitterTypeItem'
        submission_types:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionTypeItem'
        preferred_languages:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              label:
                type: string
            required:
            - code
            - label
        service_categories:
          type: array
          items:
            $ref: '#/components/schemas/OptionKeyValue'
        grievance_types:
          type: array
          items:
            $ref: '#/components/schemas/OptionKeyValue'
        phone_extensions:
          type: array
          items:
            $ref: '#/components/schemas/PhoneExtensionItem'
          nullable: true
      required:
      - submitter_types
      - submission_types
      - preferred_languages
      - service_categories
      - grievance_types
      description: Public dropdown options and intake reference data
    SubmitterProfileData:
      type: object
      properties:
        profile_id:
          type: string
          description: Unique Grievance Submitter Profile document name
        full_name:
          type: string
          description: Full name of submitter or representative
        type:
          type: string
          description: Submitter Type e.g. Individual Farmer or Cooperative
        role:
          type: string
          example: Grievance Submitter
        identity_scheme:
          type: string
          nullable: true
          enum:
          - fayda
          - org
          - phone
          - null
        identity_value:
          type: string
          nullable: true
        fayda_id:
          type: string
          nullable: true
        registration_number:
          type: string
          nullable: true
        contact_mobile:
          type: string
          nullable: true
        country_code:
          type: string
          example: '+251'
          nullable: true
        phone_number:
          type: string
          example: '911887766'
          nullable: true
        contact_email:
          type: string
          format: email
          nullable: true
        preferred_language:
